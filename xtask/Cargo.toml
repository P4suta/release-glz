[package]
name = "xtask"
description = "Repository tasks of release-glz that drive pinned verification images"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.100"

[dependencies]
assurance-core = { path = "../crates/assurance-core", version = "0.0.0" }
proc-macro2 = "1.0.107"
release-glz-core = { path = "../crates/release-glz-core", version = "0.0.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
syn = { version = "2.0.119", features = ["full", "visit"] }
tempfile = "3.27.0"
toml_edit = "0.25.19"

[lints]
workspace = true
