[package]
name = "xtask"
description = "Repository tasks of release-glz that drive pinned verification images"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.88"

[features]
# Builds the refinement vectors from a core that republishes matching objects, so the Lean gate can show that it rejects them.
negative-control-republish = ["release-glz-core/negative-control-republish"]

[dependencies]
assurance-core = { path = "../crates/assurance-core", version = "0.0.0" }
release-glz-core = { path = "../crates/release-glz-core", version = "0.0.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
