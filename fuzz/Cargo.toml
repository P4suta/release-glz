[package]
name = "release-glz-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
anyhow = "1.0.104"
libfuzzer-sys = "0.4.13"
release-glz = { path = ".." }
semver = "1.0.28"
serde_json = "1.0.154"
sha2 = "0.11.0"
toml_edit = { version = "0.25.17", features = ["serde"] }

[lib]
name = "invariants"
path = "invariants/lib.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive"
path = "fuzz_targets/archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pr_marker"
path = "fuzz_targets/pr_marker.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_interface"
path = "fuzz_targets/api_interface.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identifiers"
path = "fuzz_targets/identifiers.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
