[package]
name = "release-glz"
description = "Hex-native release automation for Gleam"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/P4suta/release-glz"
publish = false
rust-version = "1.100"
readme = "README.md"
keywords = ["gleam", "hex", "release", "automation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.6"
flate2 = "1.1.10"
icu_normalizer = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
release-glz-core = { path = "crates/release-glz-core", version = "0.0.0", features = ["serde"] }
release-glz-domain = { path = "crates/release-glz-domain", version = "0.0.0" }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17.14"
ryu-js = "1.0"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
serde_norway = "0.9.42"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = [
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "time",
] }
toml_edit = { version = "0.25.17", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10.0.1", default-features = false, features = ["job-object", "tokio1"] }

[dev-dependencies]
release-glz-test-support = { path = "crates/test-support", version = "0.0.0" }
tokio = { version = "1.54.1", features = ["test-util"] }

# The release engine meets the workspace baseline one lint group at a time.
# Each entry leaves with the change that makes the crate pass that lint.
[lints.clippy]
disallowed_methods = "allow"
disallowed_types = "allow"
too_many_arguments = "allow"
enum_variant_names = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
panic_in_result_fn = "deny"

[workspace]
members = [
  "crates/assurance-core",
  "crates/release-glz-core",
  "crates/release-glz-domain",
  "crates/test-support",
  "xtask",
]

[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "deny"
unfulfilled_lint_expectations = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(kani)'] }

unused = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
elided_lifetimes_in_paths = "deny"
unused_lifetimes = "deny"
single_use_lifetimes = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
unit_bindings = "deny"
variant_size_differences = "deny"
ambiguous_negative_literals = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
clone_on_ref_ptr = "deny"
lossy_float_literal = "deny"
rc_buffer = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
mem_forget = "deny"
arithmetic_side_effects = "deny"
cognitive_complexity = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
panic_in_result_fn = "deny"
unwrap_in_result = "deny"
try_err = "deny"
unused_result_ok = "deny"
create_dir = "deny"
error_impl_error = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
rc_mutex = "deny"
string_add = "deny"
assertions_on_result_states = "deny"
exit = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
fallible_impl_from = "deny"
shadow_unrelated = "deny"
undocumented_unsafe_blocks = "deny"

# `ring` and `jsonschema` reach two releases of `getrandom`, and the proc-macro tree reaches two of `syn`, so two versions of a crate are unavoidable.
multiple_crate_versions = "allow"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
