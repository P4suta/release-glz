[package]
name = "release-glz"
description = "Hex-native release automation for Gleam"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/P4suta/release-glz"
publish = false
rust-version = "1.88"
readme = "README.md"
keywords = ["gleam", "hex", "release", "automation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.6"
flate2 = "1.1.10"
reqwest = { version = "0.12.28", default-features = false, features = [
  "json",
  "rustls-tls",
] }
ring = "0.17.14"
ryu-js = "1.0"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
serde_norway = "0.9.42"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = [
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "time",
] }
toml_edit = { version = "0.25.17", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[dev-dependencies]
jsonschema = { version = "0.56.0", default-features = false }
release-glz-test-support = { path = "crates/test-support", version = "0.0.0" }

[workspace]
members = ["crates/test-support"]

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
