[package]
name = "release-glz-test-support"
description = "Fixtures shared by the release-glz integration tests"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.100"

[dependencies]
base64 = "0.23.1"
jsonschema = { version = "0.63.0", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
