[package]
name = "release-glz-core"
description = "Release decisions of release-glz that depend only on their inputs"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.88"

[features]
serde = ["dep:serde"]
# Each negative control breaks one decision, so the proof gate can show that the harness for it rejects a broken implementation.
# Wrapping increments instead of checked ones.
negative-control-increment = []
# Joining two bumps into the smaller one.
negative-control-join = []
# Refusing to let a state repeat itself.
negative-control-no-repeat = []
# Letting a terminal state change again.
negative-control-reopen = []
# Letting a normal state move backward.
negative-control-backward = []
# Moving only to the next normal state, never past it.
negative-control-no-skip = []
# Refusing to let an unfinished release stop in conflict or blocked.
negative-control-unstoppable = []
# Keeping an object that differs from the Candidate.
negative-control-overwrite = []
# Publishing an object that already matches the Candidate again.
negative-control-republish = []
# Proceeding without approval.
negative-control-unapproved = []
# Letting an optional effect keep a release from counting as released.
negative-control-optional-blocks = []
# Approving without the Candidate digest.
negative-control-approval = []
# Approving a push from the inputs of a manual release.
negative-control-substitution = []
# Letting a run attempt effects without spending its budget.
negative-control-unbudgeted = []
# Retrying an optional effect that a run already attempted.
negative-control-retry-optional = []
# Applying the last effect a run may apply instead of the first.
negative-control-skip-ahead = []
# Going on after a failed blocking effect that the world still lacks.
negative-control-trust-failure = []
# Stopping a run once it has attempted anything.
negative-control-stall = []
# Reporting blocked when an observation fails after a failed effect.
negative-control-forget-failure = []
# Going on with an observation of another number of objects.
negative-control-reshape = []
# Reporting blocked when an observation fails after an effect whose call succeeded.
negative-control-forget-success = []
# Reporting the state of the newest plan even below what the run already published.
negative-control-unfloored = []
# Lowering released to partially released once the run started.
negative-control-lower-released = []
# Accepting uppercase hexadecimal digits in a digest or an object id.
negative-control-hex-case = []
# Accepting a digest or an object id when any one byte is a digit.
negative-control-hex-any-byte = []
# Accepting a digest or an object id that is longer than its length.
negative-control-hex-length = []
# Accepting a `..` path component.
negative-control-path-traversal = []
# Accepting a colon in a path component.
negative-control-path-colon = []
# Recognizing a Windows device name only in uppercase.
negative-control-device-case = []
# Ending the stem of a component at its last dot instead of its first.
negative-control-device-stem = []
# Letting a file and a directory of the same folded name both stand.
negative-control-case-collision = []
# Checking only the first component of a path.
negative-control-first-component = []
# Keeping the trailing slashes of an archive path.
negative-control-keep-trailing-slashes = []
# Taking the prefix before every byte of a path for a directory.
negative-control-directory-at-every-byte = []
# Accepting an archive entry without recording it.
negative-control-forget-files = []
# Recording a later entry for a directory that an earlier entry claimed.
negative-control-overwrite-directory = []
# Ordering two prereleases with the same identifiers as unequal.
negative-control-equal-prereleases = []
# Ordering a stable release before the prereleases of its core.
negative-control-stable-before-prerelease = []
# Comparing prereleases before cores.
negative-control-prerelease-first = []
# Ordering numeric prerelease identifiers backward.
negative-control-reverse-numbers = []
# Spelling every train with the first channel's label when it meets prerelease text.
negative-control-one-label = []
# Reading `<label>.<number>` text as a train without checking its grammar.
negative-control-unchecked-train = []
# Admitting a numeric identifier with a leading zero.
negative-control-leading-zero = []
# Dropping the final check that a selection follows the published version.
negative-control-reselect = []
# Taking the published core for a stable selection without the required step.
negative-control-understep = []
# Letting a train move back to an earlier channel.
negative-control-backward-train = []
# Taking every explicit version as only a core, so one on the train starts the train again.
negative-control-explicit-retrain = []
# Taking an explicit version below the required one.
negative-control-override-floor = []
# Keeping a first prerelease of another train.
negative-control-initial-train = []
# Never applying the rule for versions below 1.0.
negative-control-zero-major = []
# Treating a change of the prerelease alone as no step.
negative-control-bump-between = []
# Releasing a version below 1.0 without its acknowledgement.
negative-control-version-zero = []
# Missing the hyphenated breaking-change footer.
negative-control-breaking-footer = []
# Matching commit types in lowercase only.
negative-control-commit-type-case = []
# Taking a breaking-change marker inside a line as a footer.
negative-control-marker-anywhere = []
# Leaving the last byte of each secret occurrence unredacted.
negative-control-redaction-partial = []
# Redacting the byte after each secret occurrence too.
negative-control-redaction-overreach = []
# Ending a redacted segment after one byte, so one covered run becomes several.
negative-control-redaction-split = []
# Redacting only the first byte of each secret occurrence, which can end inside a character.
negative-control-redaction-midchar = []
# Framing each file without the lengths of its path and contents.
negative-control-unframed-files = []
# Framing a notification without the byte that ends its Candidate digest.
negative-control-unframed-notification = []
# Sorting member names by UTF-8 bytes instead of UTF-16 code units.
negative-control-utf8-key-order = []
# Comparing member names by their first UTF-16 code unit only.
negative-control-first-unit-key-order = []
# Writing `<` into inert text as itself.
negative-control-inert-less-than = []
# Starting the search for a first occurrence one byte late.
negative-control-search-skips-start = []
# Stopping the search for a last occurrence before the last offset.
negative-control-search-stops-short = []
# Writing the fields of a marker with nothing between them.
negative-control-fields-run-together = []
# Giving back an empty value for a key that no field of a marker named.
negative-control-missing-key = []
# Finding a marker at the start of every body.
negative-control-marker-at-start = []
# Letting a later marker field replace an earlier one with the same key.
negative-control-duplicate-keys = []
# Accepting a token at the second it expires.
negative-control-token-expiry = []
# Adding the clock skew with wrapping, so a clock near the largest time refuses every token.
negative-control-token-skew-wrap = []
# Reading a leading `+` as part of a run attempt.
negative-control-signed-attempt = []
# Trusting a host that ends with the runner token zone without a dot before it.
negative-control-zone-without-dot = []
# Letting a push consume the Candidate of another run.
negative-control-push-from-another-run = []
# Waiting after the last attempt of a request too.
negative-control-retry-after-last-attempt = []
# Waiting as long as a busy response asks, however long that is.
negative-control-uncapped-busy-wait = []
# Polling again after the last poll of a wait too.
negative-control-sleep-after-last-poll = []
# Counting a listed version as visible without the docs it needs.
negative-control-ready-without-docs = []
# Reading a signed Retry-After header as a delay.
negative-control-signed-delay = []

[dependencies]
serde = { version = "1.0.228", default-features = false, features = [
  "derive",
], optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
