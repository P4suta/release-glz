name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

env:
  RUST_TEST_THREADS: 1

jobs:
  test:
    name: Test (${{ matrix.os }}, Gleam ${{ matrix.gleam }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        gleam: ["1.9.0", "1.12.0", "1.18.1"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.0"
          gleam-version: ${{ matrix.gleam }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Rust tests
        run: cargo test --workspace --all-targets --locked
      - name: CLI smoke test
        run: cargo run --locked -- --help
      - name: Action wrapper tests
        run: npm test --prefix action
      - name: Distribution evidence tests
        run: >-
          node --test
          scripts/check-coverage.test.js
          scripts/generate-action-checksums.test.js
          scripts/generate-provenance.test.js
          scripts/generate-sbom.test.js
          scripts/package-windows.test.js
          scripts/verify-release-assets.test.js
          scripts/workflow-tools.test.js

  lint:
    name: Formatting and lints
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  required:
    name: Required CI
    if: ${{ always() && !cancelled() }}
    needs: [test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the complete test matrix and lints
        env:
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$LINT_RESULT" = success
