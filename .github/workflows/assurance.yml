name: Shipping assurance

on:
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: assurance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    name: Compatibility (${{ matrix.os }}, Gleam ${{ matrix.gleam }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            gleam: "1.9.0"
          - os: ubuntu-24.04
            gleam: "1.12.0"
          - os: ubuntu-24.04
            gleam: "1.19.2"
          - os: macos-15
            gleam: "1.19.2"
          - os: windows-2025
            gleam: "1.19.2"
          - os: windows-2025
            gleam: "1.18.1"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.5"
          gleam-version: ${{ matrix.gleam }}
      - run: cargo test --workspace --all-targets --locked
      - run: cargo run --locked -- --help

  dependencies:
    name: Dependency and Rust assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
      - name: Install fixed assurance tools
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-machete --version 0.9.2
      - name: Enforce dependency source, license, and advisory policy
        run: cargo deny check -D warnings
      - name: Reject RustSec advisories and warnings
        run: |
          cargo audit -D warnings
          cargo audit -D warnings --file fuzz/Cargo.lock
      - name: Reject unused direct dependencies
        run: cargo machete --with-metadata

  workflow:
    name: Workflow authorization and supply-chain assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install fixed actionlint and zizmor
        env:
          TOOL_DIR: ${{ runner.temp }}/release-glz-tools
        run: |
          mkdir -p "$TOOL_DIR"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$TOOL_DIR/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$TOOL_DIR/actionlint.tar.gz" \
            | sha256sum --check -
          tar --extract --gzip --file "$TOOL_DIR/actionlint.tar.gz" --directory "$TOOL_DIR" actionlint
          chmod 0755 "$TOOL_DIR/actionlint"
          printf '%s\n' "$TOOL_DIR" >> "$GITHUB_PATH"
          rustup toolchain install 1.97.0 --profile minimal
          cargo +1.97.0 install --locked zizmor --version 1.31.1
      - name: Render the exact managed workflow into an isolated repository
        env:
          ACTION_SHA: ${{ github.sha }}
          GENERATED_ROOT: ${{ runner.temp }}/release-glz-generated
        run: |
          mkdir -p "$GENERATED_ROOT"
          cp tests/fixtures/workflow/gleam.toml "$GENERATED_ROOT/gleam.toml"
          git -C "$GENERATED_ROOT" init --initial-branch=main
          cargo run --locked --manifest-path Cargo.toml -- \
            --manifest-path "$GENERATED_ROOT/gleam.toml" init --update --action-sha "$ACTION_SHA"
          test -s "$GENERATED_ROOT/.github/workflows/release-glz.yml"
          grep -F "P4suta/release-glz@$ACTION_SHA" "$GENERATED_ROOT/.github/workflows/release-glz.yml"
      - name: Validate GitHub workflow syntax
        env:
          GENERATED_WORKFLOW: ${{ runner.temp }}/release-glz-generated/.github/workflows/release-glz.yml
        run: actionlint -color .github/workflows/*.yml "$GENERATED_WORKFLOW"
      - name: Reject high-severity workflow findings
        env:
          GENERATED_WORKFLOW: ${{ runner.temp }}/release-glz-generated/.github/workflows/release-glz.yml
        run: zizmor --persona auditor --min-severity high --no-online-audits .github/workflows action.yml "$GENERATED_WORKFLOW"
      - name: Verify least privilege and immutable dependencies
        env:
          GENERATED_WORKFLOW: ${{ runner.temp }}/release-glz-generated/.github/workflows/release-glz.yml
        run: node scripts/verify-workflows.js .github/workflows "$GENERATED_WORKFLOW"
      - name: Reject expression-to-shell injection paths
        env:
          GENERATED_WORKFLOW: ${{ runner.temp }}/release-glz-generated/.github/workflows/release-glz.yml
        run: node scripts/de-shell.js .github/workflows "$GENERATED_WORKFLOW"

  coverage:
    name: Line and branch coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly toolchain
        run: |
          rustup toolchain install nightly-2026-08-22 --profile minimal --component llvm-tools-preview --no-self-update
          rustup default nightly-2026-08-22
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.5"
          gleam-version: "1.19.2"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install fixed coverage tool
        run: cargo install --locked cargo-llvm-cov --version 0.9.0
      - name: Measure every Rust target with branch instrumentation
        run: cargo llvm-cov --workspace --all-targets --branch --json --output-path coverage.json
      - name: Enforce release coverage thresholds
        run: node scripts/check-coverage.js --lines 90 --branches 85

  mutation:
    name: Critical-path mutation testing (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/4", "1/4", "2/4", "3/4"]
    permissions:
      contents: read
    env:
      MUTATION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.5"
          gleam-version: "1.19.2"
      - name: Install fixed mutation tools
        env:
          NEXTEST_ARCHIVE: ${{ runner.temp }}/cargo-nextest.tar.gz
          NEXTEST_DIR: ${{ runner.temp }}/cargo-nextest
        run: |
          cargo install --locked cargo-mutants --version 27.1.0
          mkdir -p "$NEXTEST_DIR"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$NEXTEST_ARCHIVE" \
            https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.140/cargo-nextest-0.9.140-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' 4ee9aaa0d0171a985a5d0eb735b87355894c1c455972e9674fb9fdbd1387c9a3 "$NEXTEST_ARCHIVE" \
            | sha256sum --check -
          tar --extract --gzip --file "$NEXTEST_ARCHIVE" --directory "$NEXTEST_DIR" cargo-nextest
          chmod 0755 "$NEXTEST_DIR/cargo-nextest"
          printf '%s\n' "$NEXTEST_DIR" >> "$GITHUB_PATH"
      - name: Require every viable critical mutation to be caught
        run: >-
          cargo mutants --in-place --test-tool nextest --test-workspace=true
          --shard "$MUTATION_SHARD" --timeout 300 --cargo-arg=--locked
          --file src/version.rs --file src/registry.rs
          --file src/artifact.rs --file src/reconciler.rs
          --file crates/release-glz-core/src/publication.rs
          --file crates/release-glz-core/src/approval.rs

  proofs:
    name: Kani proofs of the release core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Kani verifier
        run: |
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          rustup default 1.99.0
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Prove every release core harness and satisfy every cover property
        run: |
          set -euo pipefail
          cargo kani --package release-glz-core 2>&1 | tee kani.log
          expected=$(grep -rho '#\[kani::proof\]' crates/release-glz-core/src | wc -l)
          grep -F "Complete - ${expected} successfully verified harnesses, 0 failures, ${expected} total." kani.log
          awk '/cover properties satisfied/ { if ($2 != $4) { print; unsatisfied = 1 } } END { exit unsatisfied }' kani.log
      - name: Show that each broken decision fails its proof
        run: |
          set -euo pipefail
          while IFS='|' read -r feature harness message; do
            if cargo kani --package release-glz-core --features "$feature" \
              --harness "$harness" > negative-control.log 2>&1; then
              cat negative-control.log
              echo "the $feature negative control passed $harness, which must fail" >&2
              exit 1
            fi
            grep -F "Failed Checks: $message" negative-control.log
            grep -F "VERIFICATION:- FAILED" negative-control.log
          done <<'CONTROLS'
          negative-control-increment|a_bump_raises_the_core_or_reports_an_overflow|a bump must raise the version core
          negative-control-overwrite|an_object_that_differs_ends_in_a_conflict|an object that differs must end in a conflict
          negative-control-overwrite|a_conflict_anywhere_stops_the_release|an object that differs must end in a conflict
          negative-control-republish|an_effect_concerns_only_an_object_the_world_lacks|an effect must concern an object the world lacks
          negative-control-republish|publishing_an_effect_removes_exactly_that_effect|publishing an effect must remove exactly that effect
          negative-control-unapproved|no_effect_leaves_without_approval|no effect may leave without approval
          negative-control-optional-blocks|the_release_is_released_once_no_blocking_effect_remains|a release must be released exactly when no blocking effect remains
          negative-control-approval|an_approval_needs_every_conjunct_of_its_path|an approval must cover the Candidate digest
          negative-control-substitution|a_push_approval_never_rests_on_manual_inputs|a push approval must not rest on manual inputs
          CONTROLS

  fuzz:
    name: Bounded parser fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly toolchain
        run: |
          rustup toolchain install nightly-2026-08-22 --profile minimal --no-self-update
          rustup default nightly-2026-08-22
      - name: Install fixed fuzz driver
        run: cargo install --locked cargo-fuzz --version 0.13.2
      - name: Build every fuzz target
        run: cargo fuzz build
      - name: Fuzz archive parser
        run: cargo fuzz run archive -- -runs=10000 -seed=1 -timeout=10 -rss_limit_mb=2048
      - name: Fuzz strict configuration parser
        run: cargo fuzz run config -- -runs=10000 -seed=1 -timeout=10 -rss_limit_mb=2048
      - name: Fuzz managed PR marker parser
        run: cargo fuzz run pr_marker -- -runs=10000 -seed=1 -timeout=10 -rss_limit_mb=2048
      - name: Fuzz package interface parser
        run: cargo fuzz run api_interface -- -runs=10000 -seed=1 -timeout=10 -rss_limit_mb=2048
      - name: Fuzz repository slug and prerelease channel parsers
        run: cargo fuzz run identifiers -- -runs=10000 -seed=1 -timeout=10 -rss_limit_mb=2048
