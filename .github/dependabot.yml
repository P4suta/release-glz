# Keeps the pinned supply chain moving without weakening any pin: every
# generated pull request still has to pass the workflow verifier, so an Action
# bump arrives as a full commit SHA rather than a floating tag.
#
# `action/` is deliberately absent. The wrapper declares no npm dependencies,
# so an npm ecosystem entry would never produce an update.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  # The fuzz crate carries its own workspace and lockfile.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
